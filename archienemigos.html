<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archienemigos · Casita Nodos</title>

<style>
:root{
  --bg:#fafafa;
  --fg:#222;
  --muted:#666;
  --card:#ffffff;
  --border:#ddd;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
  color:var(--fg);
  line-height:1.6;
}

main{
  max-width:800px;
  margin:auto;
  padding:3rem 1.5rem 4rem;
}

h1{
  font-size:2rem;
  margin-bottom:1rem;
}

.intro{
  color:var(--muted);
  margin-bottom:2.5rem;
}

.grid{
  display:grid;
  gap:1.2rem;
}

.card{
  display:block;
  background:var(--card);
  border:1px solid var(--border);
  padding:1.4rem;
  text-decoration:none;
  color:var(--fg);
  transition:transform .15s ease, border-color .15s ease;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#aaa;
}

.card h2{
  margin:0 0 .4rem;
  font-size:1.1rem;
}

.card p{
  margin:0;
  font-size:.9rem;
  color:var(--muted);
}

footer{
  margin-top:4rem;
  font-size:.85rem;
  color:var(--muted);
}
</style>
</head>

<body>
<main>

<h1>🗡️ Archienemigos</h1>

<p class="intro">
No son defectos.  
Son fuerzas que operan en silencio.
Cuando las ves, pierden poder.
</p>

<section class="grid">

<a class="card" href="estancador.html">
  <h2>🧱 El Estancador</h2>
  <p>Convierte intención en postergación.</p>
</a>

<a class="card" href="alarmista.html">
  <h2>🚨 El Alarmista</h2>
  <p>Activa sirenas cuando no hay incendio.</p>
</a>

<a class="card" href="agotador.html">
  <h2>🔋 El Agotador</h2>
  <p>Drena energía antes de empezar.</p>
</a>

</section>

<footer>
Volver a Casita Nodos
</footer>

</main>
</body>
</html>
